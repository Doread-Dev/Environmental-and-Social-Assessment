/* ---------- playground chrome (same as the other playgrounds) ---------- */
:root{--bg:#14161a;--panel:#1b1e23;--panel2:#23272d;--line:#30353d;--ink:#e8eaed;--muted:#9ba2ac;--accent:#86b6ec}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,"Segoe UI",Tahoma,sans-serif}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:100vh}
.controls{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 18px 40px;height:100vh;overflow:auto;position:sticky;top:0}
.controls h1{font-size:17px;margin:0 0 4px}
.intro{color:var(--muted);font-size:12.5px;margin:0 0 6px}
.grp{margin-top:15px}
.gl{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer}
.presets button:hover{border-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:#0d1b2a;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.chk input{accent-color:var(--accent)}
.hide{display:none!important}
.stage{padding:18px 22px 40px;min-width:0}
.viewport{position:relative;background:#0e1013;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frame{position:absolute;top:12px;transform-origin:top left;width:1180px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.box h2{font-size:15px;margin:0 0 8px}
.box ul{margin:0;padding-inline-start:20px}
.box li{margin-bottom:6px;font-size:13.5px}
.box.q,.box.q:first-of-type,.box.q:last-child{display:block;padding:16px 18px;border:1px solid #6b5a1e;border-radius:12px;background:#1f1c12}
.box.q li{margin-bottom:10px}
.output{margin-top:16px}
.prompt{white-space:pre-wrap;background:#0e1013;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px;direction:ltr;text-align:left}
.copy{margin-top:8px;background:var(--accent);color:#0d1b2a;border:0;border-radius:8px;padding:7px 16px;font-weight:600;cursor:pointer}
@media (max-width:1100px){.boxes{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.controls{position:static;height:auto}}

/*@tokens:css — the single source of the v2.5 tokens; other playgrounds copy this block with sync-tokens.js */
/* =====================================================================
   ESMS v2.5 FOUNDATIONS — the tokens themselves (proposal)
   Tier 1 primitives are not used by components directly; tier 2 semantic tokens are.
   ===================================================================== */
.ds{
  /* primitives: AKF's own palette (AKF brand guidelines: Foundation Green PMS 354, Verdant Green, Spring Green), forest, terrain, neutrals */
  --akf-green:#00B140; --akf-verdant:#1C7C54; --akf-spring:#98D44E; --forest-900:#0E3B2B;
  --terrain-1:#E4F2C7; --terrain-2:var(--akf-spring); --terrain-3:#5DB15F; --terrain-4:var(--akf-verdant); --terrain-5:var(--forest-900);

  /* type */
  --font-sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --text-xs:12px; --lh-xs:16px;   /* counts, badges, captions */
  --text-sm:13px; --lh-sm:20px;   /* meta, helper text, table secondary */
  --text-md:14px; --lh-md:20px;   /* UI default: controls, tables, labels */
  --text-lg:16px; --lh-lg:24px;   /* reading text: guide, help, descriptions; inputs on phones */
  --title-sm:18px; --lh-title-sm:26px; /* section headings */
  --title-md:24px; --lh-title-md:32px; /* page titles, dialog titles on phone */
  --display:30px; --lh-display:38px;  /* sign-in only */
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;

  /* space (4 px grid) and sizes */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;
  --control-sm:32px; --control-md:40px; --control-lg:48px; --row-min:44px;
  --header-h:56px; --sidebar-w:264px; --rail-w:64px; --panel-w:400px; --reading-max:72ch;

  /* shape: radius grows with the size of the thing */

  /* z layers */

}
.ds[data-theme=light]{
  --color-canvas:#F4F6F5; --color-surface:#FFFFFF; --color-raised:#FFFFFF; --color-sunken:#EEF1EF;

/* Arabic: same sizes, more line height, smallest step one pixel up, never letter-spacing */
.ds:lang(ar){--lh-sm:22px;--lh-md:24px;--lh-lg:28px;--lh-title-sm:30px;--lh-title-md:38px;--text-xs:13px;--lh-xs:18px}
/* touch screens: nothing tappable under 40 px, the default control and rows at 44 px */
@media (pointer:coarse){.ds{--control-sm:40px;--control-md:44px}}
/*@tokens:end*/

/* ---------- base (what the app's base CSS would do) ---------- */
.ds{font-family:var(--font-sans);font-size:var(--text-md);line-height:var(--lh-md);color:var(--color-text);background:var(--color-canvas);border-radius:10px;overflow:hidden;letter-spacing:0;-webkit-font-smoothing:antialiased}

.ds :focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.ds .num{font-variant-numeric:tabular-nums}
.ds .pad{padding:var(--space-8)}
.ds h3{font-size:var(--title-sm);line-height:var(--lh-title-sm);font-weight:var(--weight-semibold);margin:0 0 var(--space-2)}

.ds .muted{color:var(--color-text-muted)}
.ds .sm{font-size:var(--text-sm);line-height:var(--lh-sm)}
.ds .xs{font-size:var(--text-xs);line-height:var(--lh-xs)}
.ds .grid{display:grid;gap:var(--space-4)}
.ds .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);padding:var(--space-5)}
.ds .sect{margin-bottom:var(--space-8)}
.ds .sect>h3{margin-bottom:var(--space-1)}
.ds .sect>p.muted{margin-bottom:var(--space-4);max-width:var(--reading-max)}

/* sample controls built only from tokens */
.ds .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--control-md);padding-inline:var(--space-4);border-radius:var(--radius-sm);border:1px solid transparent;font-size:var(--text-md);font-weight:var(--weight-medium);cursor:pointer;transition:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard);white-space:nowrap;font-family:inherit}
.ds .btn.sm{height:var(--control-sm);padding-inline:var(--space-3)}
.ds .btn.lg{height:var(--control-lg);padding-inline:var(--space-6);font-size:var(--text-lg)}
.ds .btn.primary{background:var(--color-action);color:var(--color-on-action)}
.ds .btn.primary:hover{background:var(--color-action-hover)}
.ds .btn.secondary{background:var(--color-surface);color:var(--color-text);border-color:var(--color-line-strong)}
.ds .btn.secondary:hover,.ds .btn.ghost:hover{background:var(--color-hover)}
.ds .btn.ghost{background:transparent;color:var(--color-text)}
.ds .btn.danger{background:var(--danger-fg);color:var(--color-surface)}
.ds .btn .ic{width:18px;height:18px}
.ds .input{height:var(--control-md);border:1px solid var(--color-line-strong);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);padding-inline:var(--space-3);font:inherit;width:100%}
.ds .input.sm{height:var(--control-sm)}
.ds .input.lg{height:var(--control-lg)}
.ds label.lbl{display:block;font-weight:var(--weight-medium);margin-bottom:var(--space-1)}

/* badges: never colour alone (icon or symbol + word) */
.ds .badge{display:inline-flex;align-items:center;gap:var(--space-1);height:24px;padding-inline:var(--space-2);border-radius:var(--radius-sm);border:1px solid;font-size:var(--text-sm);font-weight:var(--weight-medium);white-space:nowrap;line-height:1}
.ds .badge .ic{width:15px;height:15px;stroke-width:2}
.ds .b-info{color:var(--info-fg);background:var(--info-bg);border-color:var(--info-line)}
.ds .b-ok{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-line)}
.ds .b-warn{color:var(--warn-fg);background:var(--warn-bg);border-color:var(--warn-line)}
.ds .b-danger{color:var(--danger-fg);background:var(--danger-bg);border-color:var(--danger-line)}
.ds .b-neutral{color:var(--neutral-fg);background:var(--neutral-bg);border-color:var(--neutral-line)}
.ds .b-violet{color:var(--violet-fg);background:var(--violet-bg);border-color:var(--violet-line)}
.ds .b-outline{color:var(--neutral-fg);background:transparent;border-color:var(--color-line-strong);border-style:dashed}

.ds .bars i{width:4px;border-radius:1px;background:currentColor;opacity:.22}
.ds .bars i:nth-child(1){height:6px}.ds .bars i:nth-child(2){height:10px}.ds .bars i:nth-child(3){height:14px}
.ds .bars i.on{opacity:1}
.ds .cat{display:inline-flex;align-items:center;gap:var(--space-2)}
.ds .cat b{display:inline-grid;place-items:center;min-width:28px;height:28px;padding-inline:4px;border-radius:var(--radius-sm);border:1px solid;font-weight:var(--weight-semibold);font-size:var(--text-md)}

/* notices */
.ds .notice{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border:1px solid;border-radius:var(--radius-md)}
.ds .notice .ic{margin-top:0}

/* the signature: the diamond of the AKF lattice, used as the workflow step marker */
.ds .dia{position:relative;width:22px;height:22px;flex:none;display:grid;place-items:center}
.ds .dia::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border-radius:2px;border:1.5px solid var(--color-line-strong);background:var(--color-surface)}

/* sample screen */
.ds .shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--header-h) 1fr;min-height:760px}
.ds .hdr{grid-column:1/-1;display:flex;align-items:center;gap:var(--space-3);padding-inline:var(--space-4);background:var(--color-surface);border-bottom:1px solid var(--color-line)}
.ds .mark{width:26px;height:26px;display:block}

.ds .search{display:flex;align-items:center;gap:var(--space-2);width:300px;height:var(--control-sm);border:1px solid var(--color-line);border-radius:var(--radius-sm);padding-inline:var(--space-3);color:var(--color-text-muted);background:var(--color-sunken);font-size:var(--text-sm)}
.ds .kbd{margin-inline-start:auto;font-size:var(--text-xs);border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:0 4px;direction:ltr}
.ds .ib{width:var(--control-sm);height:var(--control-sm);display:grid;place-items:center;border-radius:var(--radius-sm);position:relative;color:var(--color-text-muted)}
.ds .ib:hover{background:var(--color-hover)}
.ds .count{position:absolute;top:0;inset-inline-end:-2px;min-width:16px;height:16px;border-radius:var(--radius-full);background:var(--danger-fg);color:var(--color-surface);font-size:var(--text-xs);font-weight:600;display:grid;place-items:center;padding-inline:4px;line-height:1}

.ds .side{background:var(--color-surface);border-inline-end:1px solid var(--color-line);padding:var(--space-3) var(--space-2);display:flex;flex-direction:column;gap:2px}
.ds .back{display:flex;align-items:center;gap:var(--space-1);color:var(--color-text-muted);font-size:var(--text-sm);padding:var(--space-1) var(--space-3);margin-bottom:var(--space-2)}
.ds .pname{padding:0 var(--space-3) var(--space-3);border-bottom:1px solid var(--color-line);margin-bottom:var(--space-2)}

.ds .nav{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-md);padding-inline:var(--space-3);border-radius:var(--radius-sm);color:var(--color-text);position:relative}

.ds .toast{position:absolute;bottom:20px;inset-inline-start:50%;transform:translate(-50%,12px);opacity:0;background:var(--color-text);color:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:flex;gap:var(--space-2);align-items:center;box-shadow:var(--shadow-2);transition:opacity var(--dur-base) var(--ease-standard),transform var(--dur-base) var(--ease-standard)}

.ds[dir=rtl] .toast.open{transform:translate(50%,0)}

.ds .skel{height:12px;border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--color-sunken) 0%,var(--color-line) 50%,var(--color-sunken) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite;margin-bottom:var(--space-2)}

/* sign-in brand panel */

.ds .brandp .logo img{width:44px;height:auto;filter:brightness(0) invert(1)}
.ds .brandp h1{position:relative;font-size:var(--display);line-height:var(--lh-display);font-weight:600;margin:var(--space-16) 0 var(--space-2);max-width:14ch}
.ds .brandp p{position:relative;color:rgba(255,255,255,.78);max-width:34ch}
.ds .formp{padding:var(--space-10) var(--space-12);display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin-inline:auto}
.ds .formp h2{font-size:var(--title-md);line-height:var(--lh-title-md);margin:0 0 var(--space-6);font-weight:600}

.ds .lt>div{display:flex;align-items:center;gap:var(--space-3)}

.ds .loc td,.ds .loc th{padding:var(--space-2) var(--space-3)}

  <aside class="controls">
    <h1>أساسيات نظام التصميم (v2.5)</h1>
    <p class="intro">الطبقة الأولى من نظام التصميم: الألوان، الخط، المسافات، الأشكال، الظل، الحركة، الحالات، والتنسيقات المحلية. كل شي بالمعاينة مبني من الـ tokens نفسها، فاللي بتشوفو هون هو اللي رح يطلع بالتطبيق.</p>

      <button class="copy" id="copy">نسخ</button>
    </section>
  </main>
</div>

function locale(){
  const d = new Date(2026,10,9,14,5);
  const tag = S.lang==='ar' ? `${S.months==='levant'?'ar-SY':'ar-EG'}-u-nu-${S.digits}` : 'en-GB';
  const f = (o)=>new Intl.DateTimeFormat(tag,o).format(d);
  const n = (v,o)=>new Intl.NumberFormat(tag,o).format(v);
  const rel = new Intl.RelativeTimeFormat(tag,{numeric:'auto'});
  const rows = [
    [t('Date','التاريخ'), f({day:'numeric',month:'short',year:'numeric'}), t('Everywhere: lists, headers, exports','بكل مكان: القوائم والترويسات والتصدير')],
    [t('Date and time','التاريخ والوقت'), f({day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}), t('Activity log, notifications (24-hour)','سجل النشاط والإشعارات (24 ساعة)')],
    [t('Recent','حديثاً'), rel.format(-3,'day'), t('Notifications and "last updated", with the full date on hover','الإشعارات و"آخر تعديل"، مع التاريخ الكامل عند المرور')],
    [t('Number','رقم'), n(12345.6), t('Counts and readings','الأعداد والقراءات')],
    [t('Percent','نسبة'), n(.964,{style:'percent',minimumFractionDigits:1}), t('Monitoring results','نتائج الرصد')],
    [t('Project code','رمز المشروع'), 'ESMS-024', t('Always Latin letters and digits, so it can be searched and quoted','دايماً حروف وأرقام لاتينية، لينبحث عنو وينذكر')]
  ];
  return `<div class="pad">
    <div class="sect"><h3>${t('Dates and numbers follow the interface language','التواريخ والأرقام بتمشي مع لغة الواجهة')}</h3><p class="muted">${t('Formatted by the browser from one locale per language (no hand-made formats). The date never uses 09/11/2026: day and month swap between countries.','بتتنسّق من المتصفح حسب لغة وحدة لكل لغة (بلا تنسيقات يدوية). التاريخ ما بيستعمل 09/11/2026 أبداً، لأنو اليوم والشهر بيتبادلوا بين الدول.')}</p>
    <table class="tbl loc"><thead><tr><th>${t('What','شو')}</th><th>${t('Looks like','الشكل')}</th><th>${t('Where','وين')}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r[0]}</td><td class="num" style="font-size:var(--text-lg)">${r[1]}</td><td class="sm muted">${r[2]}</td></tr>`).join('')}</tbody></table>
    <p class="sm muted" style="margin-top:12px">${t('Arabic (owner, 2026-11-10): Western digits 0123, the same as Excel and the exports; Levantine month names (كانون الثاني، تموز، تشرين الثاني).','العربي (قرارك، 10 تشرين الثاني 2026): أرقام 0123 متل الإكسل والتصدير؛ أسماء الأشهر الشامية (كانون الثاني، تموز، تشرين الثاني).')}</p></div>
  </div>`;
}

/* ---------- build ---------- */
function segs(){
  for(const k in SEGS){
    const el = document.getElementById('seg-'+k);
    el.innerHTML = SEGS[k].map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${S[k]===v?'on':''}">${l}</button>`).join('');
  }
  document.getElementById('reduced').checked = S.reduced;
}
function ratios(){
  const ds = document.getElementById('ds'), cs = getComputedStyle(ds);
  const L = h=>{h=h.replace('#','');if(h.length!==6)return null;const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
  const surf = L(cs.getPropertyValue('--color-surface').trim());
  ds.querySelectorAll('[data-ratio]').forEach(el=>{const x=L(cs.getPropertyValue(el.dataset.ratio).trim());if(x==null||surf==null)return;const r=(Math.max(x,surf)+.05)/(Math.min(x,surf)+.05);el.textContent=r.toFixed(1)+':1';});
}
function render(){
  const ds = document.getElementById('ds');
  ds.dataset.theme = S.theme; ds.lang = S.lang; ds.dir = S.lang==='ar'?'rtl':'ltr';
  ds.classList.toggle('reduced', S.reduced);
  ds.innerHTML = RENDER[S.sec]();
  ratios();
  ds.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const el = document.getElementById('m-'+b.dataset.m); el.classList.toggle('open');
    if(b.dataset.m==='toast') setTimeout(()=>el.classList.remove('open'),2200);
  });
  document.getElementById('why').innerHTML = '<h2>ليش هيك</h2><ul>'+WHY[S.sec].map(x=>`<li>${x}</li>`).join('')+'</ul>';
  document.getElementById('questions').innerHTML = '<h2>أجوبتك</h2><ul>'+ANSWERS.map(x=>`<li>${x}</li>`).join('')+'</ul>';
}
function prompt(){
  const name = Object.fromEntries(SEGS.sec);
  const p = [`I reviewed the ESMS v2.5 design-system foundations playground (plan/design/foundations.html), section "${S.sec}", in ${S.theme} mode, interface in ${S.lang==='ar'?'Arabic':'English'}.`];
  if(S.reduced) p.push('I checked the reduced-motion behaviour.');
  p.push('My notes: ');
  document.getElementById('prompt').textContent = p.join(' ');
}
function fit(){
  const vp = document.getElementById('viewport'), fr = document.getElementById('frame');
  const s = Math.min(1, (vp.clientWidth-24)/1180);
  fr.style.transform = `scale(${s})`; fr.style.left = ((vp.clientWidth - 1180*s)/2)+'px';
  vp.style.height = (fr.offsetHeight*s+24)+'px';
}
function updateAll(){ segs(); render(); prompt(); requestAnimationFrame(fit); }

document.addEventListener('click', e=>{
  const b = e.target.closest('.seg button'); if(!b) return;
  S[b.dataset.k] = b.dataset.v; updateAll();
});
document.getElementById('reduced').onchange = e=>{ S.reduced = e.target.checked; updateAll(); };
document.getElementById('presets').innerHTML = PRESETS.map((p,i)=>`<button data-p="${i}">${p[0]}</button>`).join('');
document.getElementById('presets').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; Object.assign(S, DEFAULTS, PRESETS[b.dataset.p][1]); updateAll(); };
document.getElementById('copy').onclick = ()=>{ navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(()=>{ const c=document.getElementById('copy'); c.textContent='انتسخ!'; setTimeout(()=>c.textContent='نسخ',1200); }); };
window.addEventListener('resize', fit);
new ResizeObserver(fit).observe(document.getElementById('frame'));
document.fonts && document.fonts.ready.then(fit);
updateAll();
</script>
