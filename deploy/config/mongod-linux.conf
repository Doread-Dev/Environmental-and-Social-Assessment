# MongoDB config on Ubuntu (/etc/mongod.conf, installed by the mongodb-org package).
# Only the "replication" block is new; keep the rest as the package wrote it. Restart MongoDB
# after the change (sudo systemctl restart mongod), then run:
#   sudo -u esms node /opt/esms/backend/scripts/init-replica-set.js
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  # Only this machine: the app runs here, nobody else needs the database.
  bindIp: 127.0.0.1
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
# Single-node replica set: needed for transactions.
replication:
  replSetName: rs0
