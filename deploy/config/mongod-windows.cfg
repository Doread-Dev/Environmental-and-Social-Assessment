# MongoDB service config on Windows (C:\Program Files\MongoDB\Server\<version>\bin\mongod.cfg).
# Only the "replication" block is new; keep the paths your MongoDB install wrote. Restart the
# MongoDB service after the change, then run: node backend\scripts\init-replica-set.js
storage:
  dbPath: C:\Program Files\MongoDB\Server\8.0\data
systemLog:
  destination: file
  logAppend: true
  path: C:\Program Files\MongoDB\Server\8.0\log\mongod.log
net:
  port: 27017
  # Only this machine: the app runs here, nobody else needs the database.
  bindIp: 127.0.0.1
# Single-node replica set: needed for transactions (phase 11).
replication:
  replSetName: rs0
