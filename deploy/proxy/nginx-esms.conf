# nginx in front of ESMS (Linux, or nginx for Windows): HTTPS for the users, plain HTTP to Node on
# 127.0.0.1:3000. Copy to /etc/nginx/sites-available/esms, link it into sites-enabled, set the
# server name and certificate paths, then: sudo nginx -t && sudo systemctl reload nginx
# In backend/.env: HOST=127.0.0.1, TRUST_PROXY=true (one hop: this nginx).

upstream esms_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name esms.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name esms.example.org;

    # The organisation's certificate (full chain) and its key.
    ssl_certificate     /etc/ssl/esms/esms.crt;
    ssl_certificate_key /etc/ssl/esms/esms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:esms:10m;

    # Uploads: MAX_UPLOAD_MB (10) plus room for the form around the file, and the 10 MB JSON limit
    # of the API. Raise both together when MAX_UPLOAD_MB grows.
    client_max_body_size 12m;

    # Time for a slow upload or a big download; the API answers in seconds.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    location / {
        proxy_pass http://esms_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The client address for rate limits and logs (TRUST_PROXY=true trusts this one hop).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads go straight to Node, which checks size and type itself.
        proxy_request_buffering off;
    }

    # Security headers (CSP, HSTS, X-Frame-Options, ...) come from the app (helmet); nginx adds
    # none, so they are never sent twice.
}
